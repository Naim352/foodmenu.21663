<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--cd:#141414;--bd:#2a2a2a;--tx:#fff;--mu:#9a9a9a;--or:#ff9a1f;--rd:#ed1c24;--gn:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,system-ui,sans-serif}
h1,h2,h3,.an{font-family:Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-weight:400;letter-spacing:.5px;margin:0}
h2{font-size:34px;line-height:1.05}h3{font-size:26px;color:var(--or)}
header{padding:14px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center}
header small{color:var(--or);letter-spacing:3px;font-weight:800;font-size:12px;display:block}
.ok{margin-left:auto;background:#0e2a18;color:var(--gn);padding:10px 14px;font-weight:800;text-transform:uppercase;font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px}nav button{white-space:nowrap}
main{padding:0 14px 40px;max-width:900px;margin:auto}
button,select,input,textarea{font:inherit;color:inherit;border:1px solid var(--bd);background:#1c1c1c;padding:10px 12px;border-radius:0}
button{cursor:pointer;font-weight:800;background:var(--rd);border-color:var(--rd);color:#fff}
button.g{background:#555;border-color:#555}button.o{background:var(--or);border-color:var(--or);color:#111}button.bl{background:#2979ff;border-color:#2979ff}
button.d{background:#b0001e;border-color:#b0001e}button.s{padding:6px 10px}button.sq{width:46px;height:46px;font-size:22px;padding:0}
nav button.on{background:var(--or);border-color:var(--or);color:#111}
.cd{background:var(--cd);border:1px solid var(--bd);padding:14px;margin:12px 0}.cd.hl{border:2px solid #ffc93c}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp .cd{margin:0;border-top:4px solid var(--or)}.kp .cd.r{border-top-color:var(--rd)}.kp .cd.gr{border-top-color:var(--gn)}
.lb{color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:1px}.big{font-family:Anton,Impact,sans-serif;font-size:36px}
.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1;min-width:0}.gn{color:var(--gn);font-weight:800}.mu{color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .w{grid-column:1/-1}.g2 button{padding:16px 8px}
.tg{display:inline-block;padding:10px 12px;background:#3a1f12;color:var(--or);font-weight:800}
.tg.p{background:#0e2a18;color:var(--gn)}
.pr{display:flex;gap:8px;align-items:center;background:#181818;border-bottom:1px solid var(--bd);padding:10px}.pr b{font-size:20px}
.pr .q{width:76px;text-align:center;font-size:24px;padding:8px 0;background:#222;border:1px solid #444}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{background:var(--cd);padding:10px}
.ct{display:flex;align-items:center;gap:6px;margin:6px 0}.ct span{flex:1;text-align:center;font-weight:800}
.ct button{background:#eee;border-color:#eee;color:#111;width:44px;height:44px;font-size:20px;padding:0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.sg button{background:#1c1c1c;border-color:var(--bd);color:var(--mu)}.sg button.on{color:#fff;border-bottom:3px solid var(--or);background:#2a2018}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}.f .w{grid-column:1/-1}
details{background:var(--cd);border:1px solid var(--bd);margin:8px 0}summary{padding:12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:800}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--bd)}
#login{max-width:340px;margin:18vh auto;padding:14px}#login input{width:100%;margin:10px 0}
#tt{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;font-weight:800;display:none;z-index:9}
a{color:var(--or)}.ph{position:relative;height:110px;background:#222 center/cover;margin-bottom:8px;overflow:hidden;border-radius:8px}.ph i{position:absolute;left:8px;font:italic 800 26px Anton,Impact,sans-serif;color:var(--rd);transform:rotate(-12deg);text-shadow:0 1px 3px #000}[hidden]{display:none!important}
</style></head><body>
<div id="login" class="cd"><h2>Admin</h2><input id="key" type="password" placeholder="Mot de passe admin"><button class="o" id="go" style="width:100%">Entrer</button><div class="mu" id="le"></div></div>
<div id="app" hidden>
<header><img src="/logo.png" alt="" style="height:64px" onerror="this.remove()"><div><small>ADMIN</small><h1 style="font-size:30px;line-height:1">Tableau de bord</h1></div><span class="ok" id="ok">Connecté</span></header>
<nav id="nav"></nav><main id="main"></main>
<p style="text-align:center"><a href="/">Boutique client</a></p></div>
<div id="tt"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>(+v||0).toFixed(2).replace('.',',')+' €';
const dt=d=>new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const hm=d=>new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const SEC={menu:'Menu',kids:'Enfant',tunisien:'Tunisien'};
let KEY=sessionStorage.getItem('ak')||'',TAB='orders',P=[],S={},T={},LAST=0,NEWN=0,AC=null,MODE='journal',PER='soiree';
function toast(m){const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800);}
function beep(){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(AC.currentTime+.25);}catch(e){}}
async function api(p,m='GET',b){
  const r=await fetch('/api/admin/'+p,{method:m,headers:{'x-admin-key':KEY,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){logout();throw new Error(d.error||'Accès refusé');}
  if(!r.ok)throw new Error(d.error||'Erreur');return d;
}
const run=async f=>{const y=scrollY;try{await f();scrollTo(0,y);}catch(e){toast('❌ '+e.message);}};
function logout(){sessionStorage.removeItem('ak');KEY='';$('#app').hidden=true;$('#login').hidden=false;}
async function login(){KEY=$('#key').value;try{await api('commandes');sessionStorage.setItem('ak',KEY);$('#login').hidden=true;$('#app').hidden=false;beep();start();}catch(e){$('#le').textContent=e.message;}}
$('#go').onclick=login;$('#key').onkeydown=e=>{if(e.key==='Enter')login();};
const TABS={orders:['Commandes',rOrders],cuisine:['Cuisine',rCuisine],pos:['Street vente',rPos],stock:['Stock',rStock],cat:['Catalogue',rCat],recap:['Journal / Récap',rRecap],doc:['Gestion',rDoc],haccp:['HACCP',rHaccp],set:['Paramètres',rSet],cli:['Clients',rCli]};
function nav(){$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===TAB?'on':''}" data-tab="${k}">${v[0]}${k==='orders'&&NEWN?` (${NEWN})`:''}</button>`).join('');}
async function show(t){TAB=t;if(t==='orders')NEWN=0;nav();$('#main').innerHTML='<p class="mu">Chargement…</p>';await run(()=>TABS[t][1]());}
async function loadP(){P=(await api('produits')).produits;if(!S._default){try{S=(await(await fetch('/api/produits')).json()).supplements||{};}catch(e){}}}
const tbl=p=>(p.section==='kids'?S._kids:(S[p.categorie]||S._default))||{};
const sizes=p=>Object.keys(tbl(p));
function start(){show('orders');setInterval(poll,20000);}
async function poll(){if(!KEY)return;try{const c=(await api('commandes')).commandes,mx=c.reduce((m,o)=>Math.max(m,o.id),0);
  if(LAST&&mx>LAST){beep();toast('🔔 Nouvelle commande !');if(TAB==='orders'){LAST=mx;return rOrders();}NEWN++;nav();}LAST=mx;}catch(e){}}
/* ---- Commandes ---- */
async function rOrders(){
  const c=(await api('commandes')).commandes;LAST=c.reduce((m,o)=>Math.max(m,o.id),0);
  $('#main').innerHTML=c.length?c.map((o,i)=>{const ad=[o.adresse,o.code_postal,o.ville].filter(Boolean).join(' '),tel=String(o.telephone||'').replace(/[^\d+]/g,'');
  return `<div class="cd hl" data-id="${o.id}"><div class="rw"><h3 class="sp">${i+1}. ${esc(o.statut)}</h3><span class="lb" style="border:1px solid var(--bd);padding:8px">Commande ${hm(o.created_at)}</span></div>
  <div class="rw" style="margin:10px 0"><span class="big">${eur(o.montant)}</span><span class="tg p">Payée en ligne</span></div>
  <p style="font-size:20px;margin:6px 0">${esc(ad)}<br><a href="tel:${esc(tel)}">${esc(o.telephone)}</a> · ${esc(o.nom)}</p>
  <p style="font-size:20px">${esc(o.articles).split(', ').join('<br>')}</p>
  <div class="g2"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ad)}" target="_blank" rel="noopener" style="text-decoration:none"><button class="bl" style="width:100%;font-size:22px">Maps</button></a>
  ${o.statut==='Livré'||o.statut==='Annulé'?'<button class="o" data-act="arch">📦 Archiver</button>':'<button data-act="st" data-s="Expédié">En route</button><button data-act="st" data-s="Livré">Livrée</button><button class="g" data-act="st" data-s="Annulé">Annuler</button>'}
  <a class="w" href="mailto:${esc(o.email)}" style="text-decoration:none"><button class="o" style="width:100%">✉ Contacter</button></a></div></div>`;}).join(''):'<p class="mu">Aucune commande pour l\'instant.</p>';
}
/* ---- Street vente ---- */
async function rPos(){await loadP();drawPos();}
function drawPos(){
  const L=Object.entries(T).filter(([,q])=>q>0).map(([k,q])=>{const[id,s]=k.split('|'),p=P.find(x=>x.id==id);return{k,p,s,q,u:+p.prix+(tbl(p)[s]||0)};}),tot=L.reduce((a,l)=>a+l.u*l.q,0),n=L.reduce((a,l)=>a+l.q,0);
  $('#main').innerHTML=`<div class="cd" style="border-top:4px solid var(--rd)"><div class="rw"><h3 style="color:#fff" class="sp">Panier street vente</h3><b style="color:var(--or)">${n} article${n>1?'s':''}</b></div>
  ${L.map(l=>`<div class="rw" style="padding:6px 0"><span class="sp">${esc(l.p.nom)} <span class="mu">${esc(l.s)}</span> ×${l.q}</span><b>${eur(l.u*l.q)}</b></div>`).join('')||'<p class="mu" style="text-align:center">Aucun article sélectionné.</p>'}
  <div class="rw" style="margin-top:8px"><span class="big sp" style="color:var(--or)">${eur(tot)}</span><select id="mode"><option>Espèces</option><option>Carte</option><option>Twint</option></select><button class="o" data-act="pay" ${n?'':'disabled'}>Encaisser</button></div></div>
  ${[...new Set(P.filter(p=>p.actif).map(p=>p.categorie))].map(c=>`<h3 style="margin-top:18px">${esc(c)}</h3><div class="pg">${P.filter(p=>p.actif&&p.categorie===c).map(p=>`<div class="pc">${p.image?`<div class="ph" style="background-image:url('${encodeURI(p.image).replace(/'/g,'%27')}')">${sizes(p).slice(0,2).map((s,i)=>`<i style="top:${10+i*38}px">${esc(s)}</i>`).join('')}</div>`:''}<b>${esc(p.nom)}</b>
  <div class="mu" style="font-size:13px">${sizes(p).map(s=>esc(s)+' '+eur(+p.prix+tbl(p)[s])).join(' · ')}</div>
  <div class="${p.suivi&&p.stock<=0?'':'gn'}" style="font-size:14px">${p.suivi?(p.stock>0?`Stock disponible · ${p.stock} restant(s)`:'Épuisé'):'Stock non suivi'}</div>
  ${sizes(p).map(s=>{const k=p.id+'|'+s;return `<div class="ct"><button data-act="pq" data-k="${esc(k)}" data-d="-1">−</button><span>${T[k]||0} ${esc(s)}</span><button data-act="pq" data-k="${esc(k)}" data-d="1">+</button></div>`;}).join('')}</div>`).join('')}</div>`).join('')}`;
}
/* ---- Stock ---- */
async function rStock(){
  await loadP();const act=P.filter(p=>p.actif),tot=act.reduce((a,p)=>a+(p.suivi?p.stock:0),0),val=act.reduce((a,p)=>a+(p.suivi?p.stock*p.prix:0),0);
  $('#main').innerHTML=`<div class="rw" style="margin:14px 0"><h2 class="sp">Stock rapide</h2><span class="gn">${eur(val)} si tout vendu</span></div>
  <div class="cd" style="border-top:4px solid var(--gn)"><div class="lb">Unités en stock suivi</div><div class="big">${tot} unité(s)</div></div>`+
  [...new Set(P.map(p=>p.categorie))].sort().map(c=>{const L=P.filter(p=>p.categorie===c),v=L.reduce((a,p)=>a+(p.suivi?p.stock*p.prix:0),0);
  return `<div class="rw" style="margin-top:20px"><h2 class="sp" style="font-size:28px;color:var(--or)">${esc(c)} <span class="gn" style="font-size:16px">${eur(v)}</span></h2><button class="d s" data-act="reset" data-c="${esc(c)}">Tout remettre à zéro</button></div><div style="border-top:1px solid var(--bd)">`+
  L.map(p=>`<div class="pr" data-id="${p.id}"><div class="sp"><b>${esc(p.nom)}</b>${p.suivi?'':'<div class="mu" style="font-size:12px">non suivi</div>'}${p.actif?'':'<div class="mu" style="font-size:12px">masqué</div>'}</div>
  <button class="g s" data-act="stk" data-t="perte">Perte</button><button class="sq" data-act="stk" data-t="retrait">−</button><div class="q" style="${p.suivi&&p.stock<=5?'color:var(--rd)':''}">${p.suivi?p.stock:0}</div><button class="sq" data-act="stk" data-t="ajout">+</button></div>`).join('')+'</div>';}).join('');
}
/* ---- Catalogue ---- */
const fl=(k,l,v,t='text',w='')=>`<label class="${w}">${l}<input data-k="${k}" type="${t}" ${t==='number'?'step="0.01" min="0"':''} value="${esc(v)}"></label>`;
const pf=p=>`<div class="f">${fl('nom','Nom',p.nom)}${fl('categorie','Catégorie',p.categorie)}${fl('prix','Prix €',p.prix,'number')}${fl('ancien_prix','Ancien prix €',p.ancien_prix||'','number')}
<label>Badge<select data-k="badge">${['','new','promo','hot'].map(b=>`<option value="${b}" ${b===(p.badge||'')?'selected':''}>${b||'aucun'}</option>`).join('')}</select></label>${fl('image','Image (URL)',p.image||'','text','w')}
<label class="w">Description<textarea data-k="description" rows="2">${esc(p.description||'')}</textarea></label></div>`;
async function rCat(){
  await loadP();const act=P.filter(p=>p.actif),tot=act.reduce((a,p)=>a+(p.suivi?p.stock:0),0),red=act.filter(p=>p.suivi&&p.stock<=5).length;
  $('#main').innerHTML=`<div class="kp" style="margin-top:12px"><div class="cd"><div class="lb">Produits affichés</div><div class="big">${act.length}</div></div><div class="cd"><div class="lb">Stock total</div><div class="big">${tot}</div></div><div class="cd r" style="grid-column:1/-1"><div class="lb">Stock rouge (≤ 5)</div><div class="big">${red}</div></div></div>
  <h2 style="margin:20px 0 10px">Gestion des produits</h2>
  <details><summary>+ Ajouter un produit</summary><div data-new><div class="f"><label>Section<select data-k="section">${Object.entries(SEC).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div>${pf({})}<div style="padding:0 10px 10px"><button class="o" data-act="create">Créer</button></div></div></details>`+
  Object.entries(SEC).map(([s,l])=>`<h3 style="margin-top:16px">${l}</h3>`+P.filter(p=>p.section===s).map(p=>`<details data-id="${p.id}"><summary><span class="sp">${esc(p.nom)} <span class="mu">· ${esc(p.categorie)}</span></span><b>${eur(p.prix)}</b>${p.actif?'':'<span class="tg">masqué</span>'}</summary>${pf(p)}
  <div class="rw" style="padding:0 10px 10px"><button class="o" data-act="save">Enregistrer</button><button class="g" data-act="vis" data-v="${p.actif?0:1}">${p.actif?'Masquer':'Afficher'}</button><span class="sp"></span><button class="d" data-act="del">Supprimer</button></div></details>`).join('')).join('');
}
const rd=el=>{const o={};el.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value);return o;};
/* ---- Journal / Récap ---- */
function range(){const n=new Date();let f,t=n;
  if(PER==='soiree'){f=new Date(n);f.setHours(16,0,0,0);if(n<f)f.setDate(f.getDate()-1);t=new Date(f.getTime()+22*36e5);}
  else f=new Date(n-({j1:1,j7:7,j30:30}[PER])*864e5);return[f,t];}
async function rRecap(){
  const[f,t]=range(),q=`?from=${f.toISOString()}&to=${t.toISOString()}`,[r,j]=await Promise.all([api('recap'+q),api('journal'+q)]);
  const rows=[...j.commandes.map(o=>[o.created_at,`Site #${o.id} — ${esc(o.articles)} (${esc(o.statut)})`,eur(o.montant)]),...j.ventes.map(x=>[x.created_at,`Caisse #${x.id} — ${x.articles.map(a=>esc(a.nom)+' ×'+a.qte).join(', ')} (${esc(x.mode)})`,eur(x.total)]),...j.mouvements.map(m=>[m.created_at,`Stock : ${esc(m.type)} ${esc(m.produit_nom)} ×${m.qte}`,''])].sort((a,b)=>new Date(b[0])-new Date(a[0]));
  $('#main').innerHTML=`<h2 style="margin:16px 0">Activité</h2><select id="per" style="width:100%">${[['soiree','Cette soirée'],['j1','24 h'],['j7','7 jours'],['j30','30 jours']].map(([k,l])=>`<option value="${k}" ${k===PER?'selected':''}>${l}</option>`).join('')}</select>
  <p class="mu">Période affichée : du ${dt(f)} au ${dt(t)}.</p>
  <div class="sg"><button data-act="md" data-m="journal" class="${MODE==='journal'?'on':''}">Journal</button><button data-act="md" data-m="recap" class="${MODE==='recap'?'on':''}">Récap</button></div>`+
  (MODE==='journal'?`<h2>Journal des transactions</h2>${rows.length?`<table>${rows.map(x=>`<tr><td class="mu">${dt(x[0])}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table>`:'<p>Aucune transaction pour cette période.</p>'}`:
  `<div class="kp"><div class="cd"><div class="lb">Site</div><div class="big">${eur(r.site.ca)}</div><div class="mu">${r.site.nb} commandes</div></div><div class="cd"><div class="lb">Caisse</div><div class="big">${eur(r.street.ca)}</div><div class="mu">${r.street.nb} ventes</div></div><div class="cd gr" style="grid-column:1/-1"><div class="lb">Total</div><div class="big">${eur(+r.site.ca+ +r.street.ca)}</div></div></div>
  <h3 style="margin-top:16px">Produits vendus</h3><table>${r.vendus.map(x=>`<tr><td>${esc(x.nom)}</td><td>${x.qte}</td></tr>`).join('')||'<tr><td class="mu">Rien</td></tr>'}</table>
  <h3 style="margin-top:16px">Pertes</h3><table>${r.pertes.map(x=>`<tr><td>${esc(x.nom)}</td><td>${x.qte}</td><td>${eur(x.valeur)}</td></tr>`).join('')||'<tr><td class="mu">Aucune</td></tr>'}</table>`);
}
async function rCli(){const c=(await api('clients')).clients;
  $('#main').innerHTML=`<h2 style="margin:16px 0">Clients</h2><div class="cd"><table>${c.map(x=>`<tr><td>${esc(x.avatar)} ${esc(x.prenom)} ${esc(x.nom)}<div class="mu">${esc(x.email)}</div></td><td>${x.nb_commandes} cmd</td><td>${eur(x.total_depense)}</td></tr>`).join('')||'<tr><td class="mu">Aucun client</td></tr>'}</table></div>`;}
/* ---- Cuisine / Paramètres ---- */
async function rCuisine(){
  const[c,r]=await Promise.all([api('commandes'),api('reglages')]);
  const act=c.commandes.filter(o=>o.statut==='En traitement'),plats=act.reduce((a,o)=>a+(o.items||[]).reduce((s,i)=>s+(+i.qty||0),0),0);
  $('#main').innerHTML=`<div class="cd" style="border-left:6px solid var(--or);margin-top:14px"><h2>Ouverture prévue à ${esc(r.ouverture)}</h2><p class="mu">${esc(r.adresse||'Adresse non renseignée')}</p><button style="width:100%" data-tab="set">Modifier le plan</button></div>`+
  [['Plats prévus (commandes à préparer)',plats],['Précommandes actives',act.length],['Temps nécessaire pour préparer',r.prep_min+' min']].map(([l,v])=>`<div class="cd"><div class="lb">${l}</div><div class="big">${esc(v)}</div></div>`).join('');
}
async function rSet(){const r=await api('reglages');
  $('#main').innerHTML=`<h2 style="margin:16px 0">Paramètres</h2><div class="cd"><div class="f">${fl('ouverture','Ouverture prévue',r.ouverture,'time')}${fl('prep_min','Temps de préparation (min)',r.prep_min,'number')}${fl('adresse','Adresse de la cuisine',r.adresse,'text','w')}</div><button class="o" data-act="sset">Enregistrer</button></div>`;}
/* ---- Gestion (documents) / HACCP ---- */
let DOCS=[],DQ='',DC='',DF='',PEND=null,HS='fact';
const DCAT=['Alimentaire / HACCP','Facture','Autre'],DST=['À vérifier','À régler','Payée'];
const late=d=>d.statut==='À régler'&&d.echeance&&new Date(d.echeance)<new Date(new Date().toDateString());
const fdate=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
async function rDoc(){DOCS=(await api('documents')).documents;drawDoc();}
function fileData(f){return new Promise((ok,ko)=>{
  if(f.type==='application/pdf'){if(f.size>4e6)return ko(new Error('PDF trop lourd (4 Mo max)'));const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f);return;}
  const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7));};
  im.onerror=()=>ko(new Error('Image illisible'));im.src=URL.createObjectURL(f);});}
const dline=d=>`<div class="cd" data-id="${d.id}" style="border-left:6px solid var(--or)"><div class="lb">${esc(d.categorie)}</div><div class="an" style="font-size:26px">${esc(d.fournisseur||'Sans fournisseur')} ${esc(d.numero)}</div>
  <div class="rw"><b>${d.montant==null?'':eur(d.montant)}</b><span class="mu">Échéance ${fdate(d.echeance)}</span><span class="tg ${d.statut==='Payée'?'p':''}" ${late(d)?'style="color:#fff;background:var(--rd)"':''}>${late(d)?'En retard':esc(d.statut)}</span></div>
  <div class="rw" style="margin-top:8px"><select data-act="dst">${DST.map(s=>`<option ${s===d.statut?'selected':''}>${s}</option>`).join('')}</select>${d.has_file?'<button class="bl s" data-act="dview">Voir</button>':''}<span class="sp"></span><button class="d s" data-act="ddel">Supprimer</button></div></div>`;
function drawDoc(){
  const L=DOCS.filter(d=>(!DC||d.categorie===DC)&&(!DQ||(d.fournisseur+' '+d.numero).toLowerCase().includes(DQ)));
  $('#main').innerHTML=`<div class="rw" style="margin:14px 0"><h2 class="sp">Gestion</h2><span class="tg p">${DOCS.length} documents</span></div>
  <div class="cd" style="border-left:6px solid var(--or)">Centralisez ici vos factures et documents. Les alimentaires sont suivis dans HACCP.</div>
  <div class="g2"><button onclick="$('#fc').click()">Prendre une photo</button><button class="g" onclick="$('#fi').click()">Importer un document</button></div>
  <input id="fc" type="file" accept="image/*" capture="environment" hidden><input id="fi" type="file" accept="image/*,application/pdf" hidden>
  ${PEND?`<div class="cd hl"><h3>Nouveau document</h3><div class="f"><label>Catégorie<select data-k="categorie">${DCAT.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Statut<select data-k="statut">${DST.map(c=>`<option>${c}</option>`).join('')}</select></label>${fl('fournisseur','Fournisseur','')}${fl('numero','Numéro / référence','')}${fl('montant','Montant €','','number')}${fl('echeance','Échéance','','date')}</div><div class="rw"><button class="o" data-act="dsave">Enregistrer</button><button class="g" data-act="dcancel">Annuler</button></div></div>`:''}
  <input id="dq" placeholder="Rechercher un document, fournisseur…" value="${esc(DQ)}" style="width:100%;margin:10px 0"><select id="dc" style="width:100%"><option value="">Tous les documents</option>${DCAT.map(c=>`<option ${c===DC?'selected':''}>${c}</option>`).join('')}</select>
  ${L.map(dline).join('')||'<p class="mu">Aucun document.</p>'}`;
}
async function rHaccp(){DOCS=(await api('documents')).documents;drawHaccp();}
function drawHaccp(){
  const F=DOCS.filter(d=>d.categorie!=='Autre'),fs=[...new Set(F.map(d=>d.fournisseur).filter(Boolean))].sort(),L=F.filter(d=>(!DF||d.fournisseur===DF)&&(!DQ||(d.fournisseur+' '+d.numero).toLowerCase().includes(DQ)));
  const k=[['Factures',F.length],['À vérifier',F.filter(d=>d.statut==='À vérifier').length],['À régler',F.filter(d=>d.statut==='À régler').length],['En retard',F.filter(late).length]];
  $('#main').innerHTML=`<h2 style="margin:16px 0">HACCP</h2><div class="sg"><button data-act="hs" data-m="fact" class="${HS==='fact'?'on':''}">Factures</button><button data-act="hs" data-m="four" class="${HS==='four'?'on':''}">Fournisseurs</button></div>
  <div class="kp">${k.map(([l,v])=>`<div class="cd"><div class="rw"><span class="sp mu">${l}</span><span class="big">${v}</span></div></div>`).join('')}</div>`+
  (HS==='fact'?`<input id="dq" placeholder="Rechercher fournisseur, numéro…" value="${esc(DQ)}" style="width:100%;margin:12px 0"><select id="df" style="width:100%"><option value="">Tous les fournisseurs</option>${fs.map(f=>`<option ${f===DF?'selected':''}>${esc(f)}</option>`).join('')}</select>${L.map(dline).join('')||'<p class="mu">Aucune facture.</p>'}`:
  `<div class="cd"><table>${fs.map(f=>{const x=F.filter(d=>d.fournisseur===f);return `<tr><td><b>${esc(f)}</b></td><td>${x.length} doc</td><td>${eur(x.reduce((a,d)=>a+(+d.montant||0),0))}</td></tr>`;}).join('')||'<tr><td class="mu">Aucun fournisseur</td></tr>'}</table></div>`);
}
/* ---- Actions ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t)return show(t.dataset.tab);
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,box=b.closest('[data-id]'),id=box&&box.dataset.id;
  run(async()=>{
    if(a==='st'){if(b.dataset.s==='Annulé'&&!confirm('Annuler cette commande ? Les articles retournent en stock.'))return;await api('commandes/'+id,'PATCH',{statut:b.dataset.s});toast('Statut : '+b.dataset.s);await rOrders();}
    else if(a==='arch'){await api('commandes/'+id+'/archiver','PATCH');toast('📦 Commande archivée');await rOrders();}
    else if(a==='create'){await api('produits','POST',rd(b.closest('[data-new]')));toast('✅ Produit créé');await rCat();}
    else if(a==='save'){await api('produits/'+id,'PUT',rd(box));toast('✅ Enregistré');await rCat();}
    else if(a==='vis'){await api('produits/'+id,'PUT',{actif:b.dataset.v==='1'});await rCat();}
    else if(a==='del'){if(confirm('Supprimer définitivement ce produit ?')){await api('produits/'+id,'DELETE');await rCat();}}
    else if(a==='stk'){await api(`produits/${id}/stock`,'POST',{type:b.dataset.t,qte:1});await rStock();}
    else if(a==='reset'){if(confirm('Remettre à zéro le stock « '+b.dataset.c+' » ?')){const r=await api('stock/reset','POST',{categorie:b.dataset.c});toast(r.remis_a_zero+' produits remis à zéro');await rStock();}}
    else if(a==='pq'){const k=b.dataset.k;T[k]=Math.max(0,(T[k]||0)+(+b.dataset.d));drawPos();}
    else if(a==='pay'){const items=Object.entries(T).filter(([,q])=>q>0).map(([k,qte])=>{const[i,s]=k.split('|');return{id:+i,size:s,qte};});await api('street-vente','POST',{items,mode:$('#mode').value});T={};toast('✅ Vente enregistrée');await loadP();drawPos();}
    else if(a==='md'){MODE=b.dataset.m;await rRecap();}
    else if(a==='sset'){await api('reglages','PUT',rd(b.closest('.cd')));toast('✅ Enregistré');}
    else if(a==='dsave'){const o=rd(b.closest('.cd'));o.fichier=PEND;await api('documents','POST',o);PEND=null;toast('✅ Document ajouté');await rDoc();}
    else if(a==='dcancel'){PEND=null;drawDoc();}
    else if(a==='ddel'){if(confirm('Supprimer ce document ?')){await api('documents/'+id,'DELETE');TAB==='haccp'?await rHaccp():await rDoc();}}
    else if(a==='dview'){const f=(await api(`documents/${id}/fichier`)).fichier,bl=await(await fetch(f)).blob();window.open(URL.createObjectURL(bl),'_blank');}
    else if(a==='hs'){HS=b.dataset.m;drawHaccp();}
  });
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='per'){PER=t.value;run(rRecap);}
  else if(t.dataset.act==='dst')run(async()=>{await api('documents/'+t.closest('[data-id]').dataset.id,'PUT',{statut:t.value});toast('Statut : '+t.value);TAB==='haccp'?await rHaccp():await rDoc();});
  else if(t.id==='dc'){DC=t.value;drawDoc();}else if(t.id==='df'){DF=t.value;drawHaccp();}
  else if(t.id==='fc'||t.id==='fi'){const f=t.files[0];if(f)run(async()=>{PEND=await fileData(f);drawDoc();scrollTo(0,0);});}
});
document.addEventListener('input',e=>{if(e.target.id==='dq'){DQ=e.target.value.toLowerCase();const p=e.target.selectionStart;TAB==='haccp'?drawHaccp():drawDoc();const n=$('#dq');n.focus();n.setSelectionRange(p,p);}});
if(KEY){api('commandes').then(()=>{$('#login').hidden=true;$('#app').hidden=false;start();}).catch(()=>{});}
</script></body></html>
